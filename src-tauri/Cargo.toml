[workspace]
resolver = "3"
members = [
    "app",
    "ecs"
]

default-members = ["app"]

[workspace.dependencies]
bevy = { version = "0.16", default-features = false, features = ["multi_threaded", "std"] }
tokio = { version = "1.45.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.12"
async-nats = "0.42"
futures = "0.3.31"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tauri = { version = "2", features = [] }
